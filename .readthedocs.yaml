---
version: 2

build:
    os: ubuntu-lts-latest
    tools:
        python: '3.14'
        nodejs: '26'
    jobs:
        install:
        -   uv sync --frozen --cache-dir $READTHEDOCS_VIRTUALENV_PATH/../../uv_cache
        pre_build:
        -   make update

submodules:
    include: all
    recursive: true

python:
    install:
    -   method: uv
        command: sync

mkdocs:
    configuration: mkdocs.yml
